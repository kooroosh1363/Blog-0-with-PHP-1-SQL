name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
          coverage: none

      - name: PHP syntax
        run: |
          find src public bin tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run integration tests
        run: php tests/run.php

      - name: Exercise database initialization
        env:
          BLOG_DB_PATH: /tmp/scribe-ci.sqlite
        run: |
          php bin/init-db.php
          php bin/seed.php
          php -r '$db=new PDO("sqlite:/tmp/scribe-ci.sqlite"); if ((int)$db->query("SELECT COUNT(*) FROM posts")->fetchColumn() !== 3) exit(1);'
